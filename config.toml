# Court Annotator — default configuration
# This file is copied to ~/.config/annotator/config.toml on first run.
# Edit that copy to change runtime behaviour.

# Output canvas resolution
width  = 1920
height = 1080

# Display mode
# fullscreen = true  →  FULLSCREEN_DESKTOP (production / court machine)
# windowed   = true  →  normal resizable window at (width × height) — dev/debug
# windowed takes precedence over fullscreen when both are true
fullscreen = true
windowed   = false

# Undo / redo history depth
undo_stack_limit = 20

# Show the wall-clock time in the middle of the top bar (HH:MM).
show_time = false

# Hide the tool rail on the left-hand side entirely.
hide_toolbar = false

# Default capture device.  Leave commented to show the picker on every launch.
# device_path = "/dev/video0"

# Override the bundled DejaVu Sans font with a system font (optional)
# font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

# Default tool colour (RRGGBB hex string)
tool_color = "ffffff"

# Default brush / stroke size in pixels
tool_size = 4

# Web portal users — one administrator plus up to four more.
#
# Passwords are stored salted with PBKDF2; manage them with the
# --password command-line mode or the portal's admin reset — never by
# editing a hash in here by hand.  On first run an administrator account
# is created with a generated password printed to the console, and it
# must be changed at first login.
#
# [[users]]
# username = "admin"
# password_hash = "..."
# is_admin = true

# REST API for Crestron / remote control.
# HTTPS only: a self-signed certificate is generated next to this file
# on first run (annotator-cert.pem / annotator-key.pem), so browsers and
# control processors must accept the untrusted-certificate warning once.
[api]
enabled = true
bind    = "0.0.0.0"
port    = 8443
# token = "shared-secret"   # optional shared auth token
