# Gradle's settings for the annotator's Android build.

org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true

# The Android Gradle Plugin needs a namespace in every module; the
# application uses the same one as the SDL Java shim, because that is
# the package the shim's classes live in.
android.useAndroidX=true
android.nonTransitiveRClass=true
