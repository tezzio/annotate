name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-x86_64:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dpkg

      - name: Fetch x86_64 Debian libraries
        run: make libs-x86

      # The test step is deliberately not run here.  The test binary is
      # executed, so it needs the fetched SDL2 and its dependencies to be
      # resolvable at run time on the runner — which is a separate
      # problem from building the release binary, and one that has
      # repeatedly broken the release.
      #
      # The unit tests are run locally with `make test`, and the `check`
      # job above still gates the build on `cargo fmt` and `cargo clippy`.

      - name: Build x86_64 binary
        run: make build

      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: annotator-linux-x86_64
          path: target/x86_64/annotator
          if-no-files-found: error

  build-aarch64:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dpkg

      - name: Fetch aarch64 Debian libraries
        run: make libs-arm

      - name: Build aarch64 binary
        run: make build-arm

      - name: Upload aarch64 binary
        uses: actions/upload-artifact@v4
        with:
          name: annotator-linux-aarch64
          path: target/aarch64/annotator
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build-x86_64, build-aarch64]
    permissions:
      contents: write
    steps:
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: annotator-linux-x86_64
          path: annotator-linux-x86_64

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: annotator-linux-aarch64
          path: annotator-linux-aarch64

      - name: Rename artifacts with version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp annotator-linux-x86_64/annotator "annotator-${VERSION}-linux-x86_64"
          cp annotator-linux-aarch64/annotator "annotator-${VERSION}-linux-aarch64"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            annotator-*-linux-x86_64
            annotator-*-linux-aarch64
          generate_release_notes: true
