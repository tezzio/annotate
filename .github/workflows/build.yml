# Build and check workflow.
#
# The release is built by release.yml, not here.  When a commit and its
# tag are pushed in the same operation, GitHub creates one run for the
# branch and no separate run for the tag — so a release job living in
# this file would be skipped, because it sees a branch ref rather than
# a tag ref.  A workflow that only triggers on tags always gets its own
# run.  See release.yml.

name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build-x86_64:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dpkg

      - name: Fetch x86_64 Debian libraries
        run: make libs-x86

      # The test step is deliberately not run here.  The test binary is
      # executed, so it needs the fetched SDL2 and its dependencies to be
      # resolvable at run time on the runner — which is a separate
      # problem from building the release binary, and one that has
      # repeatedly broken the release.
      #
      # The unit tests are run locally with `make test`, and the `check`
      # job above still gates the build on `cargo fmt` and `cargo clippy`.

      - name: Build x86_64 binary
        run: make build

      - name: Upload x86_64 binary
        uses: actions/upload-artifact@v4
        with:
          name: annotator-linux-x86_64
          path: target/x86_64/annotator
          if-no-files-found: error

  build-aarch64:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl dpkg

      - name: Fetch aarch64 Debian libraries
        run: make libs-arm

      - name: Build aarch64 binary
        run: make build-arm

      - name: Upload aarch64 binary
        uses: actions/upload-artifact@v4
        with:
          name: annotator-linux-aarch64
          path: target/aarch64/annotator
          if-no-files-found: error

  # The macOS build.  It links against the system libraries and the
  # Homebrew copies of SDL2 and OpenSSL — there is no Debian sysroot on
  # a Mac, so scripts/build-macos.sh is used instead of scripts/build.sh.
  build-macos:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Homebrew dependencies
        run: |
          brew install sdl2-compat sdl2_ttf sdl3 pkg-config openssl@3

      - name: Build macOS binary
        run: make build-macos

      # The tests are run here: the macOS runner has the libraries the
      # test binary links against, so it can actually be executed.
      - name: Run the unit tests
        run: make test

      # The bundle carries its own copies of SDL2, SDL3 and OpenSSL, so
      # it runs on a machine that has never seen Homebrew.
      - name: Build the macOS bundle
        run: make package-macos

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: annotator-macos-arm64
          path: target/macos/bin/annotator
          if-no-files-found: error

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v4
        with:
          name: annotator-macos-arm64-dmg
          path: target/macos/*.dmg
          if-no-files-found: error

  # The Android build.  It cross-compiles the native library with the
  # NDK and packages it into an APK with Gradle.  The runner already
  # has the SDK, the NDK and a JDK, so nothing has to be installed.
  #
  # Every architecture Android supports is built: the four ABIs are
  # packaged into a single APK, and Android picks the right one when
  # the application is installed.
  build-android:
    runs-on: ubuntu-latest
    needs: check
    env:
      ANDROID_ABIS: arm64-v8a,armeabi-v7a,x86_64,x86
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Install cmake
        # SDL2 is built from source for Android, and that build needs
        # cmake.  The runner has an old one, which SDL2's CMakeLists
        # rejects, so a current one is installed.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Install Java 17
        # The Android Gradle Plugin wants Java 17.  The runner's
        # default JDK is newer, and Gradle refuses to parse its
        # version number ("IllegalArgumentException: 25.0.4").
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install Gradle
        # The Android Gradle Plugin needs Gradle 8.9 or newer.  The
        # wrapper is not checked in — it would add a binary to the
        # tree — so the distribution is fetched here instead.
        run: |
          curl -sL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradledist
          echo "/tmp/gradledist/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Install the Android SDK platform
        # The application compiles against API 35 and packages with
        # build-tools 35; the runner may not have that pair installed.
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build the Android APK
        run: make package-android

      - name: Upload the Android APK
        uses: actions/upload-artifact@v4
        with:
          name: annotator-android-apk
          path: target/android/*.apk
          if-no-files-found: error

  # Dependency vulnerability scan.  Advisory only (`continue-on-error`):
  # a newly published CVE must never block binaries from being built —
  # the finding shows up in the job summary and in the log, so it gets
  # triaged, but it does not fail the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        # The `rustsec/audit-check` action runs on Node 20, which the
        # runners no longer support, and it tries to create a check run
        # with a token that is not allowed to — so it fails even when
        # there is nothing to report.  The binary is fetched instead,
        # which has neither problem.
        run: |
          curl -sSfL \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0" \
            >> "$GITHUB_PATH"

      - name: Run cargo audit
        #
        # The advisories are advisory.  A newly published CVE must not
        # stop the binaries from being built, and a red cross on the
        # job says "the build is broken" when it is not — so the
        # findings are reported in the job summary and as annotations,
        # and the job itself passes.
        #
        # The summary is the only place the list is easy to read: the
        # raw JSON is not, and the log is easy to lose.
        run: |
          # `cargo audit` exits non-zero when it finds anything, which
          # is what the run step would report as a failure.
          cargo audit --json > audit.json 2> audit.err || true

          python3 - <<'PY'
          import json, os, sys

          with open("audit.json") as fh:
              report = json.load(fh)

          vulns = report.get("vulnerabilities", {}).get("list", [])
          warnings = []
          for kind, entries in (report.get("warnings") or {}).items():
              for entry in entries:
                  warnings.append((kind, entry))

          lines = ["## Dependency audit", ""]

          if not vulns and not warnings:
              lines.append("No vulnerabilities or warnings. :white_check_mark:")
          else:
              if vulns:
                  lines += [
                      f"### {len(vulns)} vulnerabilities",
                      "",
                      "| Advisory | Crate | Version | Fixed in |",
                      "|---|---|---|---|",
                  ]
                  for v in vulns:
                      a = v["advisory"]
                      p = v["package"]
                      fixed = ", ".join(v["versions"].get("patched") or []) or "-"
                      lines.append(
                          f"| [{a['id']}]({a.get('url') or ''}) | `{p['name']}` "
                          f"| {p['version']} | {fixed} |"
                      )
                      # An annotation puts the advisory in the code
                      # review as well as in the summary.
                      print(f"::warning::{a['id']} — {p['name']} {p['version']}: {a['title']}")
                  lines.append("")
              if warnings:
                  lines += [f"### {len(warnings)} warnings", ""]
                  for kind, entry in warnings:
                      a = entry["advisory"]
                      p = entry["package"]
                      lines.append(
                          f"- **{kind}** — [{a['id']}]({a.get('url') or ''}) "
                          f"`{p['name']}` {p['version']}: {a['title']}"
                      )
                      print(f"::warning::{a['id']} — {p['name']} {p['version']}: {a['title']}")
                  lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          PY
