[package]
name = "annotator"
version = "0.5.6"
edition = "2024"

[features]
# The desktop builds produce an executable; the Android build produces a
# shared library instead.  The two are separate Cargo targets, and each
# is gated on its own feature.
#
# `desktop` is on by default, so an ordinary `cargo build` produces the
# executable.  `android` is turned on by the Android build script
# instead.
default = ["desktop"]
desktop = []
android = []

# On Android the application is a shared library, not an executable:
# SDL loads `libmain.so` and calls `SDL_main` in it.  Everywhere else it
# is an ordinary binary.
#
# The library has no `required-features`: cargo's `--all-targets`
# builds it even when the feature is off, and a library without an
# entry point would then be reported as a wall of dead code.  The
# entry points are gated on the features instead, so the library is a
# valid crate either way.
[lib]
name = "annotator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "annotator"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
sdl2         = { version = "0.37", features = ["ttf"] }
libc         = "0.2"
# Work-stealing thread pool for parallel scene rasterization and the
# background rasterizer thread.  Default features pull in std; no extra
# features required for our use case.
rayon        = "1.10"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
sha2         = "0.10"
hex          = "0.4"
png          = "0.17"

# HTTPS for the REST API.  `openssl-sys` is pure FFI — it compiles no C,
# it links the prebuilt libssl from the per-arch sysroot (scripts/sysroot.sh),
# so the aarch64 cross build still needs no C toolchain.
#
# macOS ships LibreSSL as part of the system, which the OpenSSL crate does
# not support, so the Homebrew build of OpenSSL is used there instead.
#
# Android is excluded: the OpenSSL crate has no Android support at all,
# and the REST API is a control-processor feature that the tablet build
# does without.  See `src/api_android.rs`.
[target.'cfg(not(target_os = "android"))'.dependencies]
openssl      = "0.10"

# V4L2 is a Linux kernel API.  The crate is Linux-only, so it is only
# pulled in for Linux targets; macOS captures through AVFoundation instead.
#
# The JPEG decoder goes with it: it is only used for the MJPEG streams
# the V4L2 backend produces.  AVFoundation hands out uncompressed frames,
# so macOS has no use for it.
[target.'cfg(target_os = "linux")'.dependencies]
v4l          = "0.14"
# Pure-Rust JPEG decoder with SIMD on both aarch64 (NEON) and x86_64 (SSE2/AVX2).
# Explicit feature flags ensure SIMD paths are compiled in on every target.
# zune-core is required to reach DecoderOptions / ColorSpace for output colorspace control.
zune-jpeg    = { version = "0.4", default-features = false, features = ["x86", "neon", "std"] }
zune-core    = { version = "0.4", default-features = false, features = ["std"] }

# On macOS, `use-pkgconfig` lets sdl2-sys find the Homebrew SDL2 and
# SDL2_ttf instead of insisting on the system framework copies, which
# are not present on a machine that only has the Xcode command line
# tools installed.
#
# The Linux build is left alone: it links against the Debian sysroot
# through a linker wrapper, and the pkg-config probe would fail there.
#
# The AVFoundation bindings for the macOS capture backend are here too.
# They are the `objc2` family of crates: safe wrappers over the
# Objective-C runtime with no C code of their own.
[target.'cfg(target_os = "macos")'.dependencies]
sdl2                       = { version = "0.37", features = ["ttf", "use-pkgconfig"] }
objc2                       = "0.6"
objc2-foundation            = { version = "0.3", features = ["NSArray", "NSString", "NSObject", "NSError", "NSDictionary", "NSValue"] }
objc2-av-foundation         = { version = "0.3", features = [
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
    "dispatch2",
    "objc2-core-media",
    "objc2-core-video",
] }
objc2-core-media            = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMBlockBuffer"] }
objc2-core-video            = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVBase", "CVReturn"] }
dispatch2                   = "0.3"

# On Android, SDL2 has to be built from source against the NDK — there
# is no system SDL2 to link against, and the Homebrew copy is for the
# wrong platform.  The `bundled` feature builds the vendored SDL2
# sources with cmake.
#
# SDL2 is built as a *shared* library here, not linked into the
# application.  Its JNI entry points — the ones the Java shim calls,
# such as `nativeGetVersion` — live in SDL2 itself, and the shim
# reaches them by loading `libSDL2.so` and looking the symbols up in
# it.  Linking SDL2 statically would leave the shim with nothing to
# call, and the application would die with "No implementation found
# for java.lang.String org.libsdl.app.SDLActivity.nativeGetVersion()".
#
# The application itself is `libmain.so`, which links against SDL2.
[target.'cfg(target_os = "android")'.dependencies]
sdl2                       = { version = "0.37", features = ["ttf", "bundled"] }
# The camera is reached through Camera2, which cannot be called from
# Rust directly; the Java bridge does it and hands the frames over
# through JNI.
jni                        = "0.21"

[build-dependencies]
ureq    = "3"
tar     = "0.4"
bzip2   = { version = "0.4", features = ["static"] }
zip     = { version = "9", default-features = false, features = ["deflate"] }
