[package]
name = "annotator"
version = "0.1.0"
edition = "2024"

[dependencies]
sdl2         = { version = "0.37", features = ["ttf"] }
v4l          = "0.14"
# Pure-Rust JPEG decoder with SIMD on both aarch64 (NEON) and x86_64 (SSE2/AVX2).
# Explicit feature flags ensure SIMD paths are compiled in on every target.
# zune-core is required to reach DecoderOptions / ColorSpace for output colorspace control.
zune-jpeg    = { version = "0.4", default-features = false, features = ["x86", "neon", "std"] }
zune-core    = { version = "0.4", default-features = false, features = ["std"] }
libc         = "0.2"
# Work-stealing thread pool for parallel scene rasterization and the
# background rasterizer thread.  Default features pull in std; no extra
# features required for our use case.
rayon        = "1.10"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
toml         = "0.8"
sha2         = "0.10"
hex          = "0.4"
png          = "0.17"
url          = "2"

[build-dependencies]
ureq    = "2"
tar     = "0.4"
bzip2   = { version = "0.4", features = ["static"] }
zip     = { version = "2", default-features = false, features = ["deflate"] }
