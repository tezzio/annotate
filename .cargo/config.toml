# Cargo configuration for the annotator project.
#
# The cross-compilation settings live in scripts/build.sh, which points
# cargo at the Debian sysroot produced by scripts/sysroot.sh.  Nothing
# needs to be configured here — run:
#
#   ./scripts/build.sh --arch aarch64
#
# Note: a [target.aarch64-unknown-linux-gnu] linker entry here would
# OVERRIDE the -C linker= that the build script passes, so it is
# deliberately absent.  scripts/build.sh selects rust-lld, which ships
# with the Rust toolchain and needs no cross binutils on the host.

[build]
# Default to the host triple.  Override on the command line for cross
# builds, e.g. `cargo build --target aarch64-unknown-linux-gnu`.

